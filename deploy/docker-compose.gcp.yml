services:
  membership-service:
    build: ../services/membership_service
    network_mode: host
    env_file:
      - /opt/ai-marketing-factory/.env.local
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile.gcp:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    depends_on:
      - campaign-service
      - membership-service
      - frontend
    restart: unless-stopped

  frontend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
      args:
        NEXT_PUBLIC_CAMPAIGN_API_BASE: /
        NEXT_PUBLIC_MEMBERSHIP_API_BASE: /
    env_file:
      - ../.env.local
    environment:
      - CAMPAIGN_API_BASE=http://campaign-service:8080
      - MEMBERSHIP_API_BASE=http://membership-service:8095
    restart: unless-stopped

  context-viewer:
    build:
      context: ../context-viewer
      dockerfile: Dockerfile
    env_file:
      - /opt/ai-marketing-factory/.env.context-viewer
    ports:
      - "3010:3000"
    restart: unless-stopped

  campaign-service:
    build: ../services/campaign_service
    env_file:
      - ../.env.local
    environment:
      - EXTERNAL_SEARCH_PROVIDER=${EXTERNAL_SEARCH_PROVIDER:-disabled}
      - EXTERNAL_SEARCH_API_KEY=${EXTERNAL_SEARCH_API_KEY:-}
      - EXTERNAL_SEARCH_ENGINE_ID=${EXTERNAL_SEARCH_ENGINE_ID:-}
    volumes:
      - campaign_references:/app/campaign_references
      - generated_assets:/app/generated_assets
      - knowledge_uploads:/app/knowledge_uploads
    restart: unless-stopped
    depends_on:
      decision-service:
        condition: service_started
      orchestrator:
        condition: service_started
      worker-copy:
        condition: service_started
      worker-image:
        condition: service_started
      worker-video:
        condition: service_started
      worker-ads:
        condition: service_started

  decision-service:
    build: ../services/decision_service
    env_file:
      - ../.env.local
    restart: unless-stopped

  orchestrator:
    build: ../services/orchestrator
    env_file:
      - ../.env.local
    environment:
      - WORKER_ENRICHMENT_URL=http://worker-enrichment:8093
    restart: unless-stopped

  worker-copy:
    build: ../services/worker_copy
    env_file:
      - ../.env.local
    restart: unless-stopped

  worker-image:
    build: ../services/worker_image
    env_file:
      - ../.env.local
    restart: unless-stopped

  worker-video:
    build: ../services/worker_video
    volumes:
      - generated_assets:/app/generated_assets
    env_file:
      - ../.env.local
      - /opt/ai-marketing-factory/.env.video.local
    restart: unless-stopped

  worker-ads:
    build: ../services/worker_ads
    env_file:
      - ../.env.local
    restart: unless-stopped

  worker-enrichment:
    build: ../services/worker_enrichment
    expose:
      - "8093"
    volumes:
      - knowledge_uploads:/app/knowledge_uploads:ro
    env_file:
      - ../.env.local
    environment:
      - CAMPAIGN_DATABASE_URL=${POSTGRES_DSN:?POSTGRES_DSN must be set}
      - CHATBOT_INTERNAL_API_KEY=${CHATBOT_INTERNAL_API_KEY:?CHATBOT_INTERNAL_API_KEY must be set}
      - IMAGE_ANALYSIS_BASE_URL=${IMAGE_ANALYSIS_BASE_URL:-http://multimodal-provider:8080}
      - IMAGE_ANALYSIS_MODEL=${IMAGE_ANALYSIS_MODEL:-vision-model}
      - IMAGE_ANALYSIS_API_KEY=${IMAGE_ANALYSIS_API_KEY:-}
      - EMBEDDING_BASE_URL=${EMBEDDING_BASE_URL:-http://embedding-provider:8080}
      - EMBEDDING_MODEL=${EMBEDDING_MODEL:-embedding-model}
      - EMBEDDING_API_KEY=${EMBEDDING_API_KEY:-}
      - IMAGE_ANALYSIS_VERSION=${IMAGE_ANALYSIS_VERSION:-image-rag-v1}
    depends_on:
      campaign-service:
        condition: service_started
    restart: unless-stopped

volumes:
  caddy_data:
  campaign_references:
  generated_assets:
  knowledge_uploads:
